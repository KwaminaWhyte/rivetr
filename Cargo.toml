[package]
name = "rivetr"
version = "0.11.0"
edition = "2021"
rust-version = "1.95"
description = "A fast, lightweight deployment engine"
license = "MIT"
repository = "https://github.com/KwaminaWhyte/rivetr"
keywords = ["deployment", "paas", "docker", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "trace", "fs"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Docker
bollard = "0.21"

# Git (vendored-openssl for cross-compilation support)
git2 = { version = "0.21", features = ["vendored-openssl"] }

# Proxy & HTTP
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

# State management
arc-swap = "1"
dashmap = "6"
parking_lot = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
lazy_static = "1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.17"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls", "webpki-roots", "stream"] }

# TUI (optional — enabled with --features tui)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
tar = "0.4"
async-stream = "0.3"
futures = "0.3"
bytes = "1"
async-trait = "0.1"
zip = "9"

# Auth
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }  # v10+ needs an explicit crypto backend
subtle = "2.6"  # Constant-time comparison for security-sensitive operations
totp-rs = { version = "6", features = ["otpauth", "qr", "gen_secret"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# ACME (Let's Encrypt) - using ring for key generation
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
base64 = "0.23"
ring = "0.17"
pem = "4"
x509-parser = "0.18"

# Encryption (AES-256-GCM for env var encryption)
aes-gcm = "0.11"

# Email (SMTP)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
glob = "0.3"
# AWS S3 SDK
# No default features: the default "rustls" feature pulls in the legacy hyper 0.14
# client (rustls 0.21, h2 0.3), which has open security advisories. The
# default-https-client feature uses the current hyper 1 / rustls 0.23 stack.
aws-sdk-s3 = { version = "1", default-features = false, features = ["http-1x", "default-https-client", "rt-tokio"] }
aws-config = "1"
aws-credential-types = "1"
aws-types = "1"

flate2 = "1.1.5"
tempfile = "3.24.0"
tokio-util = { version = "0.7.17", features = ["io"] }

# Socket activation (systemd) — enables zero-downtime restarts
listenfd = "1"

# Embedded static files
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"

# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
tui = ["ratatui", "crossterm"]

[dev-dependencies]
tokio-test = "0.4"
tokio = { version = "1", features = ["test-util"] }

# Lint levels codified in the manifest so `cargo clippy`/`cargo build` apply them
# consistently in local dev and CI without extra flags. These all pass clean on
# the current tree — they document existing conventions rather than introduce new
# errors. Tighten to "deny" in CI via `cargo clippy -- -D warnings` if desired.
[lints.rust]
unused_imports = "warn"
unused_must_use = "warn"

[lints.clippy]
# Catch debug leftovers and obvious foot-guns at warn level.
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# "unwind" (not "abort") so a panic in any spawned task unwinds only that task
# instead of killing the whole process. Combined with parking_lot (no mutex
# poisoning) and per-connection proxy tasks, this isolates panics: one bad
# request/deploy/background-tick dies alone, the proxy and other apps keep running.
panic = "unwind"
strip = true
